name: Save Frameshift screenshots
description: Save screenshots for one Git commit

inputs:
  name:
    description: Name used by both the save and download steps
    default: frameshift-baseline-v1
    required: false
  sha:
    description: Full Git commit ID; defaults to github.sha
    required: false
  path:
    description: Folder of screenshots to save
    required: true
  retention-days:
    description: Number of days GitHub keeps the screenshots
    default: "30"
    required: false

runs:
  using: composite
  steps:
    - name: Name the saved screenshots
      id: artifact
      shell: bash
      env:
        BASELINE_NAME: ${{ inputs.name }}
        BASELINE_SHA: ${{ inputs.sha || github.sha }}
      run: node "$GITHUB_ACTION_PATH/../artifact.mjs"
    - name: Save screenshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.artifact.outputs.artifact }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

branding:
  icon: archive
  color: blue
