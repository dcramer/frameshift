name: Upload Frameshift baseline
description: Store a baseline artifact under its exact Git commit SHA

inputs:
  name:
    description: Stable name shared with the baseline restore Action
    required: true
  sha:
    description: Full Git commit SHA that produced the baseline
    required: true
  path:
    description: Baseline directory to upload
    required: true
  retention-days:
    description: Number of days GitHub retains the baseline artifact
    default: "30"
    required: false

runs:
  using: composite
  steps:
    - name: Build immutable artifact name
      id: artifact
      shell: bash
      env:
        BASELINE_NAME: ${{ inputs.name }}
        BASELINE_SHA: ${{ inputs.sha }}
      run: node "$GITHUB_ACTION_PATH/../artifact.mjs"
    - name: Upload exact baseline artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.artifact.outputs.artifact }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

branding:
  icon: archive
  color: blue
