name: Restore Frameshift baseline
description: Download an unexpired baseline artifact for an exact Git commit

inputs:
  name:
    description: Stable name shared with the baseline upload Action
    required: true
  sha:
    description: Full Git commit SHA that produced the baseline
    required: true
  path:
    description: Directory that receives the baseline artifact
    required: true
  github-token:
    description: GitHub token with actions read access
    required: true
  repository:
    description: GitHub repository in owner/name form
    required: false
  wait-seconds:
    description: Maximum time to wait for a baseline that is still uploading
    default: "180"
    required: false

runs:
  using: composite
  steps:
    - name: Resolve exact baseline artifact
      id: resolve
      shell: bash
      env:
        BASELINE_NAME: ${{ inputs.name }}
        BASELINE_REPOSITORY: ${{ inputs.repository }}
        BASELINE_SHA: ${{ inputs.sha }}
        BASELINE_TOKEN: ${{ inputs.github-token }}
        BASELINE_WAIT_SECONDS: ${{ inputs.wait-seconds }}
      run: node "$GITHUB_ACTION_PATH/resolve.mjs"
    - name: Download exact baseline artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.resolve.outputs.artifact }}
        path: ${{ inputs.path }}
        repository: ${{ steps.resolve.outputs.repository }}
        run-id: ${{ steps.resolve.outputs.run-id }}
        github-token: ${{ inputs.github-token }}

branding:
  icon: archive
  color: blue
