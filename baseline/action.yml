name: Download saved Frameshift screenshots
description: Download screenshots saved for one Git commit

inputs:
  name:
    description: Name used by both the save and download steps
    default: frameshift-baseline-v1
    required: false
  sha:
    description: Full Git commit ID; defaults to the code GitHub tested
    required: false
  path:
    description: Folder where Frameshift places the screenshots
    required: true
  github-token:
    description: GitHub token that can read Actions files
    required: false
  repository:
    description: GitHub project as owner/name
    required: false
  wait-seconds:
    description: How long to wait while screenshots are still being saved
    default: "180"
    required: false

outputs:
  sha:
    description: Git commit ID used for the downloaded screenshots
    value: ${{ steps.resolve.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Find saved screenshots
      id: resolve
      shell: bash
      env:
        BASELINE_NAME: ${{ inputs.name }}
        BASELINE_REPOSITORY: ${{ inputs.repository }}
        BASELINE_SHA: ${{ inputs.sha }}
        BASELINE_TOKEN: ${{ inputs.github-token || github.token }}
        BASELINE_WAIT_SECONDS: ${{ inputs.wait-seconds }}
      run: node "$GITHUB_ACTION_PATH/resolve.mjs"
    - name: Download saved screenshots
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.resolve.outputs.artifact }}
        path: ${{ inputs.path }}
        repository: ${{ steps.resolve.outputs.repository }}
        run-id: ${{ steps.resolve.outputs.run-id }}
        github-token: ${{ inputs.github-token || github.token }}

branding:
  icon: archive
  color: blue
