name: Publish Frameshift workflow report
description: Download and publish a report from a completed GitHub workflow

inputs:
  artifact-name:
    description: Report artifact created by the comparison workflow
    default: frameshift-report
    required: false
  github-token:
    description: GitHub token with actions, contents, statuses, and pull-request access
    required: false
  head-sha:
    description: Source commit; defaults to the completed workflow head SHA
    required: false
  pull-request:
    description: Pull request number; defaults to the completed workflow pull request
    required: false
  repository:
    description: GitHub repository in owner/name form
    required: false
  run-id:
    description: Workflow run containing the report artifact
    required: false
  viewer-url:
    description: Frameshift viewer base URL
    default: https://frameshift.pub/
    required: false

outputs:
  changes:
    description: Number of changed, added, and removed images
    value: ${{ steps.publish.outputs.changes }}
  report_ref:
    description: Immutable Git commit containing the report
    value: ${{ steps.publish.outputs.report_ref }}
  viewer_url:
    description: Direct Frameshift review URL
    value: ${{ steps.publish.outputs.viewer_url }}

runs:
  using: composite
  steps:
    - name: Download completed workflow report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/frameshift-workflow-report
        repository: ${{ inputs.repository || github.repository }}
        run-id: ${{ inputs.run-id || github.event.workflow_run.id }}
        github-token: ${{ inputs.github-token || github.token }}
    - name: Publish immutable report
      id: publish
      shell: bash
      env:
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token || github.token }}
        INPUT_HEAD-SHA: ${{ inputs.head-sha || github.event.workflow_run.head_sha }}
        INPUT_PULL-REQUEST: ${{ inputs.pull-request || github.event.workflow_run.pull_requests[0].number }}
        INPUT_REPORT: ${{ runner.temp }}/frameshift-workflow-report
        INPUT_REPOSITORY: ${{ inputs.repository || github.repository }}
        INPUT_VIEWER-URL: ${{ inputs.viewer-url }}
      run: node "$GITHUB_ACTION_PATH/../dist/index.mjs"

branding:
  icon: upload-cloud
  color: blue
