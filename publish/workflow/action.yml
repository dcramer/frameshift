name: Publish a Frameshift report
description: Download and save a report from the current or a completed GitHub workflow

inputs:
  artifact-name:
    description: Name used when the screenshot job saved the report
    default: frameshift-report
    required: false
  github-token:
    description: GitHub token that can read Actions and write the report, status, and comment
    required: false
  head-sha:
    description: Git commit; defaults to the pull request commit
    required: false
  pull-request:
    description: Pull request; defaults to the current pull request
    required: false
  repository:
    description: GitHub project as owner/name
    required: false
  retention-days:
    description: Number of days to keep published reports
    default: "30"
    required: false
  run-id:
    description: Workflow run that saved the report; defaults to the current run
    required: false
  viewer-url:
    description: Web address for Frameshift
    default: https://frameshift.pub/
    required: false

outputs:
  published:
    description: Whether this workflow produced a report
    value: ${{ steps.context.outputs.publish }}
  changes:
    description: Number of screenshots that changed, were added, or were removed
    value: ${{ steps.publish.outputs.changes }}
  report_ref:
    description: Git commit containing the saved report
    value: ${{ steps.publish.outputs.report_ref }}
  viewer_url:
    description: Link to the report
    value: ${{ steps.publish.outputs.viewer_url }}

runs:
  using: composite
  steps:
    - name: Check the workflow
      id: context
      shell: bash
      run: node "$GITHUB_ACTION_PATH/context.mjs"
    - name: Download report
      if: steps.context.outputs.publish == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/frameshift-workflow-report
        repository: ${{ inputs.repository || github.repository }}
        run-id: ${{ inputs.run-id || steps.context.outputs.run-id }}
        github-token: ${{ inputs.github-token || github.token }}
    - name: Save report and add its link
      if: steps.context.outputs.publish == 'true'
      id: publish
      shell: bash
      env:
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token || github.token }}
        INPUT_HEAD-SHA: ${{ inputs.head-sha || steps.context.outputs.head-sha }}
        INPUT_PULL-REQUEST: ${{ inputs.pull-request || steps.context.outputs.pull-request }}
        INPUT_REPORT: ${{ runner.temp }}/frameshift-workflow-report
        INPUT_REPOSITORY: ${{ inputs.repository || github.repository }}
        INPUT_RETENTION-DAYS: ${{ inputs.retention-days }}
        INPUT_VIEWER-URL: ${{ inputs.viewer-url }}
      run: node "$GITHUB_ACTION_PATH/../dist/index.mjs"

branding:
  icon: upload-cloud
  color: blue
