name: Publish Frameshift report
description: Save a screenshot report and link it from GitHub

inputs:
  comment-on-no-changes:
    description: Comment when every screenshot matches
    default: "false"
    required: false
  report:
    description: Report folder
    required: true
  github-token:
    description: GitHub token with permission to save the report, set a status, and comment
    required: true
  head-sha:
    description: Full Git commit ID that gets the Frameshift status
    required: true
  pull-request:
    description: Pull request number that gets the report comment
    required: false
  repository:
    description: GitHub project in owner/name form
    required: false
  retention-days:
    description: Number of days to keep published reports
    default: "30"
    required: false
  viewer-url:
    description: Web address for Frameshift
    default: https://frameshift.pub/
    required: false

outputs:
  changes:
    description: Number of screenshots that changed, were added, or were removed
  report_ref:
    description: Full Git commit ID containing the saved report
  viewer_url:
    description: Link to the report

runs:
  using: node24
  main: dist/index.mjs

branding:
  icon: upload-cloud
  color: blue
