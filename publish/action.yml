name: Publish Frameshift report
description: Save a screenshot report and add its link to GitHub

inputs:
  report:
    description: Report folder
    required: true
  github-token:
    description: GitHub token that can write contents, statuses, and pull request comments
    required: true
  head-sha:
    description: Git commit that gets the Frameshift status
    required: true
  pull-request:
    description: Pull request that gets the report comment
    required: false
  repository:
    description: GitHub project as owner/name
    required: false
  viewer-url:
    description: Web address for Frameshift
    default: https://frameshift.pub/
    required: false

outputs:
  changes:
    description: Number of screenshots that changed, were added, or were removed
  report_ref:
    description: Git commit containing the saved report
  viewer_url:
    description: Link to the report

runs:
  using: node24
  main: dist/index.mjs

branding:
  icon: upload-cloud
  color: blue
