name: Frameshift
description: Compare two directories of PNG screenshots and create a visual-diff report

inputs:
  baseline:
    description: Directory with baseline PNG files
    required: true
  candidate:
    description: Directory with candidate PNG files
    required: true
  output:
    description: Directory for the report and its referenced images
    required: true

outputs:
  changes:
    description: Number of changed, added, and removed images

runs:
  using: node24
  main: dist/index.mjs

branding:
  icon: crosshair
  color: blue
