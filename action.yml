name: Frameshift
description: Compare two folders of PNG screenshots and create a review report

inputs:
  baseline:
    description: Folder with screenshots from before the change
    required: true
  candidate:
    description: Folder with screenshots after the change
    required: true
  output:
    description: Folder where Frameshift writes the report
    required: true
  pull-request-number:
    description: Pull request number to include in the report
    required: false
  pull-request-title:
    description: Pull request title to include in the report
    required: false

outputs:
  changes:
    description: Number of screenshots that changed, were added, or were removed

runs:
  using: node24
  main: dist/index.mjs

branding:
  icon: crosshair
  color: blue
