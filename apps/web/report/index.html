<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review a Frameshift screenshot report." />
    <title>Report · Frameshift</title>
    <noscript>
      <style>
        .noscript-shell {
          position: fixed;
          inset: 0;
          display: grid;
          box-sizing: border-box;
          place-items: center;
          padding: 24px;
          background: #0c0f0f;
          color: #f2f4ee;
          font-family:
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        }

        .noscript-panel {
          width: min(520px, 100%);
          border: 1px solid #343a38;
          padding: clamp(28px, 6vw, 48px);
          background: #121616;
        }

        .noscript-panel p {
          margin: 16px 0 0;
          color: #aeb6b2;
          line-height: 1.6;
        }

        .noscript-panel h1 {
          margin: 12px 0 0;
          font-size: clamp(30px, 7vw, 46px);
          letter-spacing: -0.04em;
          line-height: 1;
        }

        .noscript-kicker {
          margin: 0 !important;
          color: #caff00 !important;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main class="noscript-shell">
        <section class="noscript-panel">
          <p class="noscript-kicker">Frameshift</p>
          <h1>JavaScript is required.</h1>
          <p>Enable JavaScript and reload this page to review the report.</p>
        </section>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
