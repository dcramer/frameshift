name: Check screenshots with Frameshift
description: Save screenshots from the default branch or compare a pull request

inputs:
  screenshots:
    description: Folder containing the PNG screenshots from your tests
    required: true
  saved-name:
    description: Name used to keep this screenshot set separate from others
    default: frameshift-baseline-v1
    required: false
  screenshot-retention-days:
    description: Number of days GitHub keeps default-branch screenshots
    default: "30"
    required: false
  report-retention-days:
    description: Number of days GitHub keeps pull request reports
    default: "7"
    required: false
  github-token:
    description: GitHub token with permission to read saved screenshots
    required: false

outputs:
  mode:
    description: "What Frameshift did: saved screenshots, made a report, or skipped the run"
    value: ${{ steps.context.outputs.mode }}
  changes:
    description: Number of changed, added, and removed screenshots
    value: ${{ steps.compare.outputs.changes }}
  before-commit:
    description: Full Git commit ID used for the before screenshots
    value: ${{ steps.before.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Decide what to do
      id: context
      shell: bash
      run: node "$GITHUB_ACTION_PATH/context.mjs"
    - name: Check screenshots
      if: steps.context.outputs.mode != 'skip'
      shell: bash
      env:
        FRAMESHIFT_SCREENSHOTS: ${{ inputs.screenshots }}
      run: node "$GITHUB_ACTION_PATH/validate.mjs"
    - name: Name the screenshots
      if: steps.context.outputs.mode == 'save'
      id: saved-screenshots
      shell: bash
      env:
        BASELINE_NAME: ${{ inputs.saved-name }}
        BASELINE_SHA: ${{ github.sha }}
      run: node "$GITHUB_ACTION_PATH/../baseline/artifact.mjs"
    - name: Save default-branch screenshots
      if: steps.context.outputs.mode == 'save'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.saved-screenshots.outputs.artifact }}
        path: ${{ inputs.screenshots }}
        if-no-files-found: error
        retention-days: ${{ inputs.screenshot-retention-days }}
        compression-level: 0
    - name: Find the before screenshots
      if: steps.context.outputs.mode == 'report'
      id: before
      shell: bash
      env:
        BASELINE_NAME: ${{ inputs.saved-name }}
        BASELINE_REPOSITORY: ${{ github.repository }}
        BASELINE_SHA: ""
        BASELINE_TOKEN: ${{ inputs.github-token || github.token }}
        BASELINE_WAIT_SECONDS: "180"
      run: node "$GITHUB_ACTION_PATH/../baseline/resolve.mjs"
    - name: Download the before screenshots
      if: steps.context.outputs.mode == 'report'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.before.outputs.artifact }}
        path: ${{ runner.temp }}/frameshift/before
        repository: ${{ steps.before.outputs.repository }}
        run-id: ${{ steps.before.outputs.run-id }}
        github-token: ${{ inputs.github-token || github.token }}
    - name: Create screenshot report
      if: steps.context.outputs.mode == 'report'
      id: compare
      shell: bash
      env:
        INPUT_BASELINE: ${{ runner.temp }}/frameshift/before
        INPUT_CANDIDATE: ${{ inputs.screenshots }}
        INPUT_OUTPUT: ${{ runner.temp }}/frameshift/report
      run: node "$GITHUB_ACTION_PATH/../dist/index.mjs"
    - name: Save screenshot report
      if: steps.context.outputs.mode == 'report'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: frameshift-report
        path: ${{ runner.temp }}/frameshift/report
        if-no-files-found: error
        retention-days: ${{ inputs.report-retention-days }}
        compression-level: 0

branding:
  icon: camera
  color: blue
