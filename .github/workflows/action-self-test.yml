name: Action self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-self-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Run checked-in action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.frameshift.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - name: Test baseline artifact resolver
        run: node --test baseline/resolve.test.mjs
      - name: Prepare deterministic fixture
        run: node packages/action/src/qa.mjs prepare "$RUNNER_TEMP/frameshift-action"
      - name: Run checked-in action
        id: frameshift
        uses: ./
        with:
          baseline: ${{ runner.temp }}/frameshift-action/baseline
          candidate: ${{ runner.temp }}/frameshift-action/candidate
          output: ${{ runner.temp }}/frameshift-action/report
      - name: Verify action contract
        env:
          ACTION_CHANGES: ${{ steps.frameshift.outputs.changes }}
        run: node packages/action/src/qa.mjs verify "$RUNNER_TEMP/frameshift-action"
      - name: Summarize demonstration
        env:
          ACTION_CHANGES: ${{ steps.frameshift.outputs.changes }}
        run: |
          printf '%s\n' \
            "## Frameshift Action self-test" \
            "" \
            "The checked-in Action found **${ACTION_CHANGES} expected visual changes**." \
            "" \
            "The generated report is retained for seven days and published by the next job." \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Test baseline artifact upload
        uses: ./baseline/upload
        with:
          name: frameshift-action-baseline
          path: ${{ runner.temp }}/frameshift-action/report
          retention-days: 7
      - name: Retain generated report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frameshift-action-report
          path: ${{ runner.temp }}/frameshift-action/report
          if-no-files-found: error
          retention-days: 7
      - name: Restore report for the tested PR base
        if: github.event_name == 'pull_request'
        id: baseline
        uses: ./baseline
        with:
          name: frameshift-action-baseline
          path: ${{ runner.temp }}/frameshift-base-report
      - name: Verify automatic base selection
        if: github.event_name == 'pull_request'
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$BASELINE_SHA" = "$EXPECTED_BASE_SHA"
          test -f "$RUNNER_TEMP/frameshift-base-report/report.json"

  publish:
    name: Publish Frameshift report
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            publish
      - name: Publish verified workflow report
        id: publish
        uses: ./publish/workflow
        with:
          artifact-name: frameshift-action-report
          head-sha: ${{ github.sha }}
          run-id: ${{ github.run_id }}
      - name: Link published report
        env:
          VIEWER_URL: ${{ steps.publish.outputs.viewer_url }}
        run: |
          printf '%s\n' \
            "## Published Frameshift report" \
            "" \
            "[Open the immutable visual report](${VIEWER_URL})" \
            >> "$GITHUB_STEP_SUMMARY"
