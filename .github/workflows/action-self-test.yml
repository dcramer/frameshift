name: Action self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-self-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Run checked-in action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.frameshift.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare deterministic fixture
        run: node packages/action/src/qa.mjs prepare "$RUNNER_TEMP/frameshift-action"
      - name: Run checked-in action
        id: frameshift
        uses: ./
        with:
          baseline: ${{ runner.temp }}/frameshift-action/baseline
          candidate: ${{ runner.temp }}/frameshift-action/candidate
          output: ${{ runner.temp }}/frameshift-action/report
      - name: Verify action contract
        env:
          ACTION_CHANGES: ${{ steps.frameshift.outputs.changes }}
        run: node packages/action/src/qa.mjs verify "$RUNNER_TEMP/frameshift-action"
      - name: Summarize demonstration
        env:
          ACTION_CHANGES: ${{ steps.frameshift.outputs.changes }}
        run: |
          printf '%s\n' \
            "## Frameshift Action self-test" \
            "" \
            "The checked-in Action found **${ACTION_CHANGES} expected visual changes**." \
            "" \
            "The generated report is retained for seven days and published by the next job." \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Retain generated report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frameshift-action-report
          path: ${{ runner.temp }}/frameshift-action/report
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Frameshift report
    needs: contract
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      statuses: write
    steps:
      - name: Mark Frameshift status pending
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"
          -f state=pending
          -f context=Frameshift
          -f description="Publishing visual report"
          -f target_url="${RUN_URL}"
      - name: Download verified report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frameshift-action-report
          path: ${{ runner.temp }}/frameshift-report
      - name: Check out report seed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: frameshift-reports
          path: published
      - name: Publish immutable report
        id: publish
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/frameshift-report
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git -C published switch --detach
          git -C published rm -r --ignore-unmatch .
          cp -R "${REPORT_DIRECTORY}/." published/
          git -C published add .
          git -C published config user.name "github-actions[bot]"
          git -C published config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C published commit --allow-empty -m "Publish report for ${GITHUB_SHA}"

          report_ref=$(git -C published rev-parse HEAD)
          report_tag="frameshift-report/${TARGET_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C published tag "$report_tag"
          git -C published push origin "refs/tags/${report_tag}"

          viewer_url="https://frameshift.pub/?repo=${GITHUB_REPOSITORY}&ref=${report_ref}"
          printf 'report_ref=%s\nviewer_url=%s\n' "$report_ref" "$viewer_url" >> "$GITHUB_OUTPUT"
      - name: Complete Frameshift status
        env:
          ACTION_CHANGES: ${{ needs.contract.outputs.changes }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VIEWER_URL: ${{ steps.publish.outputs.viewer_url }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"
          -f state=success
          -f context=Frameshift
          -f description="${ACTION_CHANGES} visual changes"
          -f target_url="${VIEWER_URL}"
      - name: Link published report
        env:
          VIEWER_URL: ${{ steps.publish.outputs.viewer_url }}
        run: |
          printf '%s\n' \
            "## Published Frameshift report" \
            "" \
            "[Open the immutable visual report](${VIEWER_URL})" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Mark Frameshift status failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"
          -f state=error
          -f context=Frameshift
          -f description="Could not publish visual report"
          -f target_url="${RUN_URL}"
