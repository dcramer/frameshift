name: Action self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: action-self-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_action:
    name: Run the checked-in Action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install test packages
        run: pnpm install --frozen-lockfile
      - name: Test saved screenshot lookup
        run: node --test baseline/resolve.test.mjs
      - name: Create repeatable test screenshots
        run: node packages/action/src/qa.mjs prepare "$RUNNER_TEMP/frameshift-action"
      - name: Select completed test screenshots
        id: screenshots
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            path="$RUNNER_TEMP/frameshift-action/candidate"
          else
            path="$RUNNER_TEMP/frameshift-action/baseline"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Record completed test screenshots
        id: frameshift
        uses: ./ci
        with:
          screenshots: ${{ steps.screenshots.outputs.path }}
          saved-name: frameshift-action-baseline
          screenshot-retention-days: 7
          report-retention-days: 7
      - name: Check the pull request report
        if: github.event_name == 'pull_request'
        env:
          ACTION_CHANGES: ${{ steps.frameshift.outputs.changes }}
        run: >-
          node packages/action/src/qa.mjs verify
          "$RUNNER_TEMP/frameshift-action"
          "$RUNNER_TEMP/frameshift/report"
      - name: Summarize the test
        if: github.event_name == 'pull_request'
        env:
          ACTION_CHANGES: ${{ steps.frameshift.outputs.changes }}
        run: |
          printf '%s\n' \
            "## Frameshift Action self-test" \
            "" \
            "The checked-in Action found changes in **${ACTION_CHANGES} screenshots**, as expected." \
            "" \
            "GitHub keeps the report for seven days. The next job links it from the pull request." \
            >> "$GITHUB_STEP_SUMMARY"

  frameshift:
    name: Link Frameshift report
    needs: test_action
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # This job never checks out or runs pull request code.
      - uses: dcramer/frameshift/publish/workflow@e964f36af42dfb2594f308ebbf1a9ea51e666c17
