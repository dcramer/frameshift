name: Action self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-self-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Run checked-in action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.frameshift.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare deterministic fixture
        run: node packages/action/src/qa.mjs prepare "$RUNNER_TEMP/frameshift-action"
      - name: Run checked-in action
        id: frameshift
        uses: ./
        with:
          baseline: ${{ runner.temp }}/frameshift-action/baseline
          candidate: ${{ runner.temp }}/frameshift-action/candidate
          output: ${{ runner.temp }}/frameshift-action/report
      - name: Verify action contract
        env:
          ACTION_CHANGES: ${{ steps.frameshift.outputs.changes }}
        run: node packages/action/src/qa.mjs verify "$RUNNER_TEMP/frameshift-action"
      - name: Summarize demonstration
        env:
          ACTION_CHANGES: ${{ steps.frameshift.outputs.changes }}
        run: |
          printf '%s\n' \
            "## Frameshift Action self-test" \
            "" \
            "The checked-in Action found **${ACTION_CHANGES} expected visual changes**." \
            "" \
            "The generated report is retained for seven days and published by the next job." \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Retain generated report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frameshift-action-report
          path: ${{ runner.temp }}/frameshift-action/report
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Frameshift report
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: publish
      - name: Download verified report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frameshift-action-report
          path: ${{ runner.temp }}/frameshift-report
      - name: Publish immutable report
        id: publish
        uses: ./publish
        with:
          report: ${{ runner.temp }}/frameshift-report
          github-token: ${{ github.token }}
          head-sha: ${{ github.sha }}
      - name: Link published report
        env:
          VIEWER_URL: ${{ steps.publish.outputs.viewer_url }}
        run: |
          printf '%s\n' \
            "## Published Frameshift report" \
            "" \
            "[Open the immutable visual report](${VIEWER_URL})" \
            >> "$GITHUB_STEP_SUMMARY"
